name: VK -> MAX

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vk-to-max
  cancel-in-progress: false

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Зависимости
        run: pip install -r requirements.txt
      - name: Перенос постов
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          MAX_TOKEN: ${{ secrets.MAX_TOKEN }}
        run: python vk_to_max.py --once --wait 5
      - name: Сохранить точку отсчёта
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .state
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "state: last post id [skip ci]"
            git push
          fi
